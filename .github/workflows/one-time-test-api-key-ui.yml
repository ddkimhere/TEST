name: TEST API key setup patch

on:
  push:
    branches:
      - chore/test-api-key-once-20260812
    paths:
      - .github/workflows/one-time-test-api-key-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/test-api-key-once-20260812
      - name: Patch TEST API key UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          html = base64.b64decode('').decode('utf-8')
          js = base64.b64decode('').decode('utf-8')
          pattern = re.compile(r'<input\s+type="password"\s+id="config-api-key"\s+oninput="saveApiKey\(this\.value\)"\s+placeholder="AI Studio의 API Key를 입력하세요\.\.\."\s+class="[^"]+">')
          text, n = pattern.subn(html, text, count=1)
          if n != 1: raise SystemExit(f'API key input replacement failed: {n}')
          old = "function saveApiKey(val) { apiKey = val.trim(); localStorage.setItem('monthly_exam_api_key', apiKey); }"
          if old not in text: raise SystemExit('saveApiKey function not found')
          text = text.replace(old, js, 1)
          marker = 'window.onload = function() {'
          if marker not in text: raise SystemExit('window.onload not found')
          text = text.replace(marker, marker + '\n            updateApiKeyUI();', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove helper workflow
        run: rm -f .github/workflows/one-time-test-api-key-ui.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-test-api-key-ui.yml
          git commit -m "Make TEST API key a one-time browser setup"
          git push origin HEAD:chore/test-api-key-once-20260812
